name: QTI Score

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: latest
          core-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Mooncakes dependencies
        run: moon update
      - name: Install SDK type checker
        run: npm ci --prefix sdk --ignore-scripts
      - name: Check QTI library and host entry points
        run: python tools/project.py check
      - name: Install XML schema validator
        run: python -m pip install lxml==6.1.1
      - name: Validate standard results and complete test execution
        run: |
          python tools/asi_schema_test.py --report _build/asi-schema-report.json
          python tools/result_schema_test.py --report _build/result-schema-report.json
          python tools/runtime_test.py --output _build/runtime-validation.json
      - name: Verify independent QTI implementation
        run: |
          npm install --prefix _build/interop --no-save --package-lock=false @longsightgroup/qti3-core@0.13.3 @longsightgroup/qti3-player@0.13.3 playwright-core@1.64.1
          node tools/independent_test.mjs --browser --output _build/independent-validation.json
