<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">学习空间示意图</title>
  <desc id="description">左侧资料阅读区，右侧小组合作区，下方圆形成果展示区。</desc>
  <rect width="640" height="360" rx="16" fill="#f5f7fb"/>
  <rect x="40" y="60" width="240" height="160" rx="14" fill="#dceafe" stroke="#3865a5" stroke-width="2"/>
  <rect x="360" y="60" width="240" height="160" rx="14" fill="#d8f4e8" stroke="#27775b" stroke-width="2"/>
  <circle cx="320" cy="290" r="45" fill="#fce8c3" stroke="#a8782c" stroke-width="2"/>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#1d2d48">
    <text x="160" y="130">资料阅读区</text>
    <text x="480" y="130">小组合作区</text>
    <text x="320" y="296" font-size="16">成果展示区</text>
  </g>
  <g fill="#fff" stroke="#7193bd" stroke-width="2">
    <rect x="82" y="155" width="60" height="34" rx="4"/>
    <rect x="177" y="155" width="60" height="34" rx="4"/>
    <circle cx="480" cy="175" r="30"/>
  </g>
</svg>
